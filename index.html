<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>LUKA</title>

  <!-- Aplica el tema guardado antes de pintar para evitar el parpadeo -->
  <script>  
    (function () {
      try {
        var t = localStorage.getItem("luka_theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        if (t === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B1220");
        }
      } catch (e) {}
    })();
  </script>

  <!-- Pantalla de apertura: una vez por sesión del navegador y nunca con "reducir movimiento" -->
  <script>
    (function () {
      try {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || sessionStorage.getItem("luka_splash")) return;
        sessionStorage.setItem("luka_splash", "1");
      } catch (e) {}
      document.documentElement.classList.add("splash-on");
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LUKA" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/main.css?v=1.5" />
  <link rel="stylesheet" href="css/components.css?v=1.5" />
  <link rel="stylesheet" href="css/views.css?v=1.5" />
  <link rel="stylesheet" href="css/glass.css?v=1.5" />
  <link rel="stylesheet" href="css/splash.css?v=1.5" />
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-bg"></div>
    <div class="splash-stage">
      <div class="splash-ripple"></div>
      <div class="splash-ripple r2"></div>
      <svg class="splash-ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" /></svg>
      <img class="splash-logo" src="favicon.svg" alt="" />
      <div class="splash-word"><span>L</span><span>U</span><span>K</span><span>A</span></div>
      <p class="splash-tag">Tus finanzas, <em>bajo control.</em></p>
    </div>
  </div>

  <header class="navbar">
    <div class="brand">
      <img src="favicon.svg" alt="LUKA" style="width: 22px; height: 22px; border-radius: 6px; vertical-align: middle;" /> LUKA
    </div>

    <!-- Las pestañas se deslizan en horizontal en pantallas pequeñas -->
    <div id="nav-tabs" class="nav-links" style="display: none;">
      <button class="nav-item-btn active" data-tab="dashboard"><i class="fa-solid fa-house"></i> Inicio</button>
      <button class="nav-item-btn" data-tab="wallets"><i class="fa-solid fa-wallet"></i> Billeteras</button>
      <button class="nav-item-btn" data-tab="budgets"><i class="fa-solid fa-bullseye"></i> Presupuesto</button>
      <button class="nav-item-btn" data-tab="cards"><i class="fa-solid fa-credit-card"></i> Crédito</button>
      <button class="nav-item-btn" data-tab="subs"><i class="fa-solid fa-calendar-days"></i> Suscripciones</button>
      <button class="nav-item-btn" data-tab="savings"><i class="fa-solid fa-piggy-bank"></i> Ahorros</button>
      <button class="nav-item-btn" data-tab="analytics"><i class="fa-solid fa-chart-pie"></i> Análisis</button>
    </div>

    <div class="nav-actions">
      <button id="btn-theme" class="btn-theme-icon" type="button" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro" aria-pressed="false">
        <i class="fa-solid fa-moon"></i>
      </button>
      <div id="user-menu" class="user-menu-box" style="display: none;">
        <span id="user-name" style="display: none;"></span>
        <button id="btn-logout" class="btn-logout-icon" title="Cerrar sesión" aria-label="Cerrar sesión">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="app"></div>
  </main>

  <footer class="app-footer">
    <button id="btn-install" class="btn-install" type="button" hidden>
      <i class="fa-solid fa-arrow-down-to-line"></i>
      <span>Instalar app</span>
    </button>
    <span class="footer-author">by <span>Santiago Escobar</span></span>
  </footer>

  <button id="btn-start-tutorial" class="tutorial-fab" title="Ver Guía de LUKA" style="display: none;">
    <i class="fa-solid fa-lightbulb"></i>
    <span>Tutorial</span>
  </button>

  <script type="module" src="js/main.js?v=1.5"></script>
  <script>
    // Registro del service worker: habilita la instalación y el arranque offline.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
