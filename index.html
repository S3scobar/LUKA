<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUKA</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
  <!-- Favicon SVG Oficial LUKA -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <!-- BARRA SUPERIOR -->
  <header class="navbar">
    <div class="brand">
      <img src="favicon.svg" alt="LUKA" style="width: 24px; height: 24px; border-radius: 6px; vertical-align: middle;" /> LUKA
    </div>
    
    <!-- Pestañas de Navegación -->
    <div id="nav-tabs" class="nav-links" style="display: none;">
      <button class="nav-item-btn active" data-tab="dashboard"><i class="fa-solid fa-house"></i> Inicio</button>
      <button class="nav-item-btn" data-tab="wallets"><i class="fa-solid fa-wallet"></i> Billeteras</button>
      <button class="nav-item-btn" data-tab="cards"><i class="fa-solid fa-credit-card"></i> Tarjetas</button>
      <button class="nav-item-btn" data-tab="subs"><i class="fa-solid fa-calendar-days"></i> Suscripciones</button>
      <button class="nav-item-btn" data-tab="savings"><i class="fa-solid fa-piggy-bank"></i> Ahorros</button>
      <button class="nav-item-btn" data-tab="analytics"><i class="fa-solid fa-chart-pie"></i> Análisis</button>
    </div>

<!-- Menú de Usuario (Solo el botón de salir, limpio y compacto) -->
    <div id="user-menu" style="display: none; align-items: center;">
      <span id="user-name" style="display: none;"></span>
      <button id="btn-logout" class="btn btn-secondary btn-sm" title="Cerrar sesión" style="padding: 0.45rem 0.65rem; border-radius: 8px;">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container">
    <div id="app"></div>
  </main>

  <!-- Marca de agua -->
  <div class="watermark-author">
    by: <span>Santiago Escobar</span>
  </div>

  <script type="module">
    import { authService } from "./js/services/authService.js";
    import { authView } from "./js/views/authView.js";
    import { walletsView } from "./js/views/walletsView.js";
    import { dashboardView } from "./js/views/dashboardView.js";
    import { creditCardsView } from "./js/views/creditCardsView.js";
    import { subscriptionsView } from "./js/views/subscriptionsView.js";
    import { savingsView } from "./js/views/SavingsView.js";
    import { analyticsView } from "./js/views/analyticsView.js";

    const navTabs = document.getElementById("nav-tabs");
    const userMenu = document.getElementById("user-menu");
    const userName = document.getElementById("user-name");
    const logoutBtn = document.getElementById("btn-logout");

    let currentTab = "dashboard";

    function switchView(tab) {
      currentTab = tab;

      document.querySelectorAll("[data-tab]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });

      if (tab === "dashboard") dashboardView.render("app");
      else if (tab === "wallets") walletsView.render("app");
      else if (tab === "cards") creditCardsView.render("app");
      else if (tab === "subs") subscriptionsView.render("app");
      else if (tab === "savings") savingsView.render("app");
      else if (tab === "analytics") analyticsView.render("app");

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-tab]");
      if (navBtn) {
        switchView(navBtn.dataset.tab);
      }
    });

    async function initApp() {
      try {
        const user = await authService.getCurrentUser();
        if (user) {
          userMenu.style.display = "flex";
          navTabs.style.display = "flex";
          userName.textContent = user.user_metadata?.full_name || user.email;
          switchView(currentTab);
        } else {
          userMenu.style.display = "none";
          navTabs.style.display = "none";
          authView.render("app", () => initApp());
        }
      } catch (err) {
        userMenu.style.display = "none";
        navTabs.style.display = "none";
        authView.render("app", () => initApp());
      }
    }

    initApp();

    authService.onAuthStateChanged((user) => {
      if (!user) {
        userMenu.style.display = "none";
        navTabs.style.display = "none";
        authView.render("app", () => initApp());
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await authService.signOut();
      initApp();
    });
  </script>
</body>
</html>
