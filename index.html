<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>LUKA</title>

  <!-- Aplica el tema guardado antes de pintar para evitar el parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("luka_theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        if (t === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0B1220");
        }
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/main.css?v=1.2" />
  <link rel="stylesheet" href="css/components.css?v=1.2" />
  <link rel="stylesheet" href="css/views.css?v=1.2" />
  <link rel="stylesheet" href="css/glass.css?v=1.2" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="favicon.svg" alt="LUKA" style="width: 22px; height: 22px; border-radius: 6px; vertical-align: middle;" /> LUKA
    </div>

    <!-- Las pestañas se deslizan en horizontal en pantallas pequeñas -->
    <div id="nav-tabs" class="nav-links" style="display: none;">
      <button class="nav-item-btn active" data-tab="dashboard"><i class="fa-solid fa-house"></i> Inicio</button>
      <button class="nav-item-btn" data-tab="wallets"><i class="fa-solid fa-wallet"></i> Billeteras</button>
      <button class="nav-item-btn" data-tab="budgets"><i class="fa-solid fa-bullseye"></i> Presupuesto</button>
      <button class="nav-item-btn" data-tab="cards"><i class="fa-solid fa-credit-card"></i> Crédito</button>
      <button class="nav-item-btn" data-tab="subs"><i class="fa-solid fa-calendar-days"></i> Suscripciones</button>
      <button class="nav-item-btn" data-tab="savings"><i class="fa-solid fa-piggy-bank"></i> Ahorros</button>
      <button class="nav-item-btn" data-tab="analytics"><i class="fa-solid fa-chart-pie"></i> Análisis</button>
    </div>

    <div class="nav-actions">
      <button id="btn-theme" class="btn-theme-icon" type="button" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro" aria-pressed="false">
        <i class="fa-solid fa-moon"></i>
      </button>
      <div id="user-menu" class="user-menu-box" style="display: none;">
        <span id="user-name" style="display: none;"></span>
        <button id="btn-logout" class="btn-logout-icon" title="Cerrar sesión" aria-label="Cerrar sesión">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="app"></div>
  </main>

  <div class="watermark-author">
    by: <span>Santiago Escobar</span>
  </div>

  <button id="btn-start-tutorial" class="tutorial-fab" title="Ver Guía de LUKA" style="display: none;">
    <i class="fa-solid fa-lightbulb"></i>
    <span>Tutorial</span>
  </button>

  <script type="module" src="js/main.js?v=1.2"></script>
</body>
</html>
